name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Build-time placeholders only: no step connects to this database. The
      # integration tests start their own mongod through mongodb-memory-server.
      MONGODB_URI: mongodb://127.0.0.1:27017/ci
      JWT_SECRET: ci-placeholder-secret
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19
          cache: npm

      - name: Install dependencies
        run: npm ci

      # mongodb-memory-server downloads a ~120 MB mongod on first use.
      - name: Cache the MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
